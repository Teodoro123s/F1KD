services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - f1kd-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: f1kd-backend
    env_file:
      - ./server/.env
    environment:
      DB_HOST: host.docker.internal
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: f1kd-documents
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - f1kd-network

volumes:
  minio-data:

networks:
  f1kd-network:
    driver: bridge

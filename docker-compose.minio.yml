services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-f1kd}
      MARIADB_USER: ${DB_USER:-f1kd_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the root .env file}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-Superadmin@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in the root .env file}
      SELF_HEAL_ADMIN_CREDENTIALS: ${SELF_HEAL_ADMIN_CREDENTIALS:-false}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      EMAILJS_USER_TEMPLATE_ID: ${EMAILJS_USER_TEMPLATE_ID:-}
      EMAILJS_OTP_TEMPLATE_ID: ${EMAILJS_OTP_TEMPLATE_ID:-}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-f1kd}
      DB_USER: ${DB_USER:-f1kd_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-f1kd-documents}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./server/data/uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mariadb-data:
  minio-data:

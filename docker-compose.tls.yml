services:
  web:
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH to the certificate chain file}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH to the TLS private key file}:/etc/nginx/tls/privkey.pem:ro
